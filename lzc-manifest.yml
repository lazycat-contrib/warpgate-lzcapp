application:
  subdomain: warpgate
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: https://warpgate:{{ .U.http_port }}/
      disable_backend_ssl_verify: true # Warpgate uses self-signed TLS
  ingress:
    - protocol: tcp
      port: "{{ .U.ssh_port }}"
      service: warpgate
    - protocol: tcp
      port: "{{ .U.mysql_port }}"
      service: warpgate
  injects:
    - id: login-autofill
      when:
        - /login
      do:
        - src: builtin://simple-inject-password
          params:
            user: "admin"
            password: "{{ .U.adminpassword }}"
services:
  warpgate:
    # upstream: ghcr.io/warp-tech/warpgate:0.30.4
    image: ghcr.1ms.run/warp-tech/warpgate:0.30.4
    binds:
      - /lzcapp/var/data:/data
    environment:
      - WARPGATE_ADMIN_PASSWORD={{ .U.adminpassword }}
    setup_script: |
      if [ -f /lzcapp/var/data/warpgate.yaml ]; then
        echo "warpgate.yaml already exists"
      else
        echo "warpgate.yaml does not exist, creating it"
        /usr/local/bin/warpgate unattended-setup --data-path /data --http-port {{ .U.http_port }} --ssh-port {{ .U.ssh_port }} --mysql-port {{ .U.mysql_port }}  && cp /etc/warpgate.yaml /data/warpgate.yaml
      fi
      # Enable trust_x_forwarded_headers for reverse proxy support (SSO, correct redirect URLs)
      if grep -q 'trust_x_forwarded_headers' /lzcapp/var/data/warpgate.yaml; then
        sed -i 's/trust_x_forwarded_headers:.*/trust_x_forwarded_headers: true/' /lzcapp/var/data/warpgate.yaml
      else
        sed -i '/^http:/a\  trust_x_forwarded_headers: true' /lzcapp/var/data/warpgate.yaml
      fi
usage: |
  Warpgate 是零配置堡垒机/跳板机：统一代理 SSH、HTTP/HTTPS、MySQL 与 PostgreSQL
  访问，支持会话录制、权限审批与 SSO，适合把内网服务安全地开放给团队。

  首次打开用内置管理员账号登录：
    - 用户名：admin
    - 密码：安装时填写的「管理员密码」（默认随机生成）

  用户可在「设置 → 用户」中创建，并为每个用户单独授权可访问的目标。
  SSH / MySQL 代理端口可在安装时自定义（默认 2222 / 33306）。

  说明：
    - 应用自带账号体系，直接对外开放由 Warpgate 自己的登录页鉴权，所以使用 public_path。
    - 本包未做实机验证。
